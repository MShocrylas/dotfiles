# Enable truecolor support (For some reason isn't working rn)
set -g default-terminal "tmux-256color"
# set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm*:Tc"

# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",*256col*:Tc"
# set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
# set-environment -g COLORTERM "truecolor"

# Increase history limit
set-option -g history-limit 50000

# Enable mouse control
set -g mouse on

set -s set-clipboard on

# Switch from emacs to vi keybinds in copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ...
set-window-option -g xterm-keys on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

## Lvim recommended settings
# Adjust escape time
set-option -sg escape-time 10

# ...
set-option -g focus-events on


##
# Display the pane indexes (C+a q) for longer  
set -g display-panes-time 4000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Deleting a mid-sequence window will renumber subsequent windows
set -g renumber-windows on

# Ctrl+A -> <Action>
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes using H and V keys (and others)
bind | split-window -h -b
bind _ split-window -v
bind v split-window -v
unbind '"'
unbind %

# Easy reload config
bind r source-file $HOME/.tmux.conf \; display-message "~/.tmux.conf reloaded."
 

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# Resize panes
bind C-down resize-pane -D 15
bind C-up resize-pane -U 15
bind C-left resize-pane -L 15
bind C-right resize-pane -R 15

# Swaps current pane with marked pane (mark with <prefix> + m)
bind M swap-pane

# Fix Home/End Keybindings
bind -n Home send Escape "[H"
bind -n End send Escape "[F"

# Set up preferred layout on a fresh window
bind L split-window -h \; select-pane -L \; split-window -v \; split-window -v


## source: https://github.com/sbernheim4/dotfiles/blob/251a30db0dbbd2953df35bfa0ef43e92ce15b752/tmux/.tmux.conf#L1
# Configuring bottom status bar
set -g status-style bg=colour237,fg=colour223 
set -g status-left "\
#[fg=colour7, bg=colour241]#{?client_prefix,#[bg=colour167],} ❐ #S \
#[fg=colour241, bg=colour237]#{?client_prefix,#[fg=colour167],}#{?window_zoomed_flag, 🔍,}"

set -g status-right "\
#[fg=colour246, bg=colour237]\
#[fg=colour214, bg=colour237] #h \
#[fg=colour246, bg=colour237]  %b %d '%y\
#[fg=colour109]  %H:%M \
#[fg=colour248, bg=colour239]"

set -g status-justify left
set -g status-left-length 30
set -g status-right-length 150

# Set windows status bars
set -g window-status-separator ""
set-window-option -g window-status-current-format "\
#[fg=colour237, bg=colour214]\
#[fg=colour239, bg=colour214] #I* \
#[fg=colour239, bg=colour214, bold] #W \
#[fg=colour214, bg=colour237]"
set-window-option -g window-status-format "\
#[fg=colour237,bg=colour239,noitalics]\
#[fg=colour223,bg=colour239] #I \
#[fg=colour223, bg=colour239] #W \
#[fg=colour239, bg=colour237]"

## Colors
# Set active pane border color
set-option -g pane-active-border-style fg=colour214

# Set inactive pane border color
set-option -g pane-border-style fg=colour239

# Default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 

# Bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

# Message info
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# Writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# Pane number display
set-option -g display-panes-active-colour colour1 #fg2
set-option -g display-panes-colour colour237 #bg1

